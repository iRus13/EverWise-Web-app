server {
    listen 80;
    listen [::]:80;
    server_name everwise.dexio-games.com;

    root /var/www/everwise-current/dist;
    index index.html;

    # Baseline browser security headers. `always` keeps them on error
    # responses too. Note nginx only inherits add_header into a location that
    # declares none of its own, which is the case for every location below.
    #
    # Clickjacking: the app handles sign-in and payment, so it must never be
    # framed. frame-ancestors is the modern control; X-Frame-Options stays for
    # older browsers that ignore CSP.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # TLS is terminated in front of this origin; HSTS still needs to be sent
    # from here so it reaches the browser.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A full CSP (script-src/connect-src) is deliberately NOT enforced yet:
    # getting the Firebase, Stripe, Google Fonts and Cloudflare allowlist wrong
    # blanks the whole app. This reports violations without blocking anything,
    # so the allowlist can be confirmed from real traffic before enforcing.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://static.cloudflareinsights.com; frame-src https://checkout.stripe.com https://billing.stripe.com; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location ^~ /api/billing/ {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /api/stripe/webhook {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location ^~ /api/partner/ {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /api/read-aloud {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /api/check-message {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }

    location = /welcome {
        return 301 /welcome/;
    }

    location ^~ /welcome/ {
        alias /var/www/everwise-marketing-current/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
